name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    # Free-plan private repositories cannot use Pages. Keep source private
    # until the owner explicitly chooses public visibility or upgrades.
    if: github.event.repository.private == false || vars.PAGES_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Prepare portable static website
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/build_pages.py
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
